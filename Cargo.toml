[package]
name = "il2cpp_dumper"
version = "0.7.0"
edition = "2024"
authors = ["Rodroidmods"]
license = "MIT"
description = "A blazing fast and reliable il2cpp dumper cross platfrom."
homepage = "https://github.com/rodroidmods/il2cpp-dumper-rs"
repository = "https://github.com/rodroidmods/il2cpp-dumper-rs"
keywords = ["il2cpp", "dumper", "android", "windows", "reverse-engineering"]
categories = ["development-tools", "parsing", "security"]
readme = "README.md"

[[bin]]
name = "il2cpp_dumper"
path = "src/main.rs"

# Shared library consumed by the Android app (jniLibs/arm64-v8a/
# librodroid_il2cppdumper.so). The crate name must match the
# System.loadLibrary("rodroid_il2cppdumper") call in DumperBridge.java.
[lib]
name = "rodroid_il2cppdumper"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
byteorder = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
dotnetdll = { version = "0.1.3", path = "dotnetdll-main" }
indicatif = "0.18"
jni = "0.22"
lz4_flex = "0.11"
rayon = "1.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
yaxpeax-arm = "0.4"
yaxpeax-arch = "0.3"
iced-x86 = "1.21"
include_dir = "0.7.4"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# unwind (not abort) so the JNI bridge can catch_unwind engine panics and
# surface them as Java-visible error strings instead of crashing the app.
panic = "unwind"
strip = true
debug = false
overflow-checks = false

[profile.release.package."*"] 
opt-level = 3
codegen-units = 1
strip = true
debug = false
overflow-checks = false
